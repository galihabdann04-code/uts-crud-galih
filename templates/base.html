<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Mahasiswa</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    a.btn, button { display: inline-block; padding: 6px 12px; border: 1px solid #333; border-radius: 4px;
                    background: #fff; color: #222; text-decoration: none; cursor: pointer; font-size: 14px; }
    a.btn.primary { background: #1a56db; color: #fff; border-color: #1a56db; }
    button.danger { background: #c62828; color: #fff; border-color: #c62828; }
    .flash { padding: 10px 14px; border-radius: 4px; margin: 8px 0; }
    .flash.error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
    .flash.success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <h1>Sistem Data Mahasiswa</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
