{% extends "base.html" %}
{% block content %}
<h2>Detail Mahasiswa</h2>
<table>
  <tr><th>NIM</th><td>{{ m.nim }}</td></tr>
  <tr><th>Nama</th><td>{{ m.nama }}</td></tr>
  <tr><th>Program Studi</th><td>{{ m.program_studi }}</td></tr>
  <tr><th>Angkatan</th><td>{{ m.angkatan }}</td></tr>
  <tr><th>IPK</th><td>{{ "%.2f"|format(m.ipk) }}</td></tr>
  <tr><th>Lama Studi (tahun)</th><td>{{ m.lama_studi }}</td></tr>
</table>
<p><a class="btn" href="/">Kembali</a></p>
{% endblock %}
